# Ruff configuration for the repo's Python scripts (the code carries
# `# ruff: noqa` directives). Run via pixi: `pixi run lint` / `pixi run format`.
line-length = 100
target-version = "py310"

[lint]
# Ruff's defaults (pyflakes + a subset of pycodestyle) plus import-sorting (I)
# and pyupgrade (UP); catches real issues without flooding this script-heavy
# repo with style noise.
extend-select = ["I", "UP"]
